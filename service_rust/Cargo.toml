[package]
name = "magic_mouse_service"
version = "0.1.4"
edition = "2021"
authors = ["MagicMouse Contributors"]
description = "Background driver for the Apple Magic Mouse on Windows"

[dependencies]
hidapi = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-service = "0.6"
crossbeam-channel = "0.5"
ctrlc = "3.4"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
]
