name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Cache vcpkg packages ──────────────────────────────────────────────────
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ── Bootstrap vcpkg ───────────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "C:\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Set up .NET 8 (for WinUI settings app) ────────────────────────────────
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── Configure CMake (Release) ─────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_BUILD_TYPE=Release

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ── Upload native binaries ────────────────────────────────────────────────
      - name: Upload hid_logger
        uses: actions/upload-artifact@v4
        with:
          name: hid_logger
          path: build/tools/hid_logger/Release/hid_logger.exe
          if-no-files-found: warn

      - name: Upload tray_host
        uses: actions/upload-artifact@v4
        with:
          name: tray_host
          path: build/tools/tray_host/Release/tray_host.exe
          if-no-files-found: warn

      - name: Upload settings_app
        uses: actions/upload-artifact@v4
        with:
          name: settings_app
          path: build/ui/settings_app/settings_app.exe
          if-no-files-found: warn
